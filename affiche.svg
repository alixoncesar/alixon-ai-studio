<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a3a"/>
      <stop offset="0.55" stop-color="#0f3d8a"/>
      <stop offset="1" stop-color="#1d6bd6"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9cc7ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#9cc7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond -->
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="860" cy="260" r="380" fill="url(#glowViolet)"/>
  <circle cx="180" cy="1080" r="420" fill="url(#glowBlue)"/>

  <!-- Lignes décoratives -->
  <path d="M0 980 Q540 880 1080 980" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" fill="none"/>
  <path d="M0 1010 Q540 910 1080 1010" stroke="#c79bff" stroke-opacity="0.2" stroke-width="2" fill="none"/>

  <!-- Nom de marque -->
  <text x="540" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="8" fill="#ffffff">ALIXON <tspan fill="#c79bff">AI STUDIO</tspan></text>
  <line x1="390" y1="195" x2="690" y2="195" stroke="#c79bff" stroke-width="3"/>

  <!-- Titre principal -->
  <text x="540" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="800" fill="#ffffff">Votre vision,</text>
  <text x="540" y="555" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="800" fill="#ffffff">notre créativité</text>

  <!-- Sous-titre -->
  <text x="540" y="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#d6e6ff">propulsée par l'intelligence artificielle</text>

  <!-- Services -->
  <text x="540" y="790" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#9cc7ff">🎬 Vidéos publicitaires</text>
  <text x="540" y="860" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#9cc7ff">🌸 Parfums &amp; cosmétiques</text>
  <text x="540" y="930" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#9cc7ff">🎨 Affiches &amp; visuels</text>

  <!-- Appel à l'action -->
  <rect x="190" y="1040" width="700" height="90" rx="45" fill="#ffffff"/>
  <text x="540" y="1098" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#0f3d8a">Commandez sur notre site</text>

  <!-- Lien -->
  <text x="540" y="1200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#ffffff">alixoncesar.github.io/alixon-ai-studio</text>

  <!-- Pied -->
  <text x="540" y="1290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-style="italic" fill="#d6e6ff">L'imagination devient réalité.</text>
</svg>
